# --- Gradle ---
org.gradle.jvmargs=-Xmx1g -Dfile.encoding=UTF-8
org.gradle.caching=true

# --- Параметры прогона по умолчанию (переопределяются через -P<имя>=<значение>) ---
# Браузер: chrome | firefox | edge | safari
browser=chrome
# Версия браузера (имеет смысл для remote/Selenoid), пусто = любая
browserVersion=
# Доп. аргументы браузера через запятую (например --no-sandbox в Docker под root)
browserArgs=
# Режим: desktop | mobile
mode=desktop
# Устройство для mobile: имя из Chrome DevTools ("iPhone 12 Pro", "Pixel 7") или WIDTHxHEIGHT@DPR ("390x844@3")
device=iPhone 12 Pro
# Свой User-Agent для mobile (нужен для custom-устройства и для Firefox), пусто = по устройству
userAgent=
# Размер окна в desktop
resolution=1920x1080
headless=false
# URL Selenium Grid / Selenoid, пусто = локальный браузер
remote=
enableVnc=true
enableVideo=false
baseUrl=https://market.yandex.ru
# Таймауты, мс
timeout=10000
pageLoadTimeout=30000
# Количество параллельных потоков JUnit
threads=1
# Фильтр по тегам JUnit (через запятую): ui, screenshot, smoke ...
tags=
excludeTags=
# Скриншот-тесты: перезаписать эталоны / допустимый % отличающихся пикселей
updateBaseline=false
screenshotTolerance=0.5

# --- Антибот (SmartCaptcha) ---
# Скрыть признаки автоматизации Chromium: navigator.webdriver, флаг enable-automation
stealth=true
# Человеческий темп: случайные паузы перед действиями и посимвольный ввод (false = максимальная скорость)
humanize=true
# Диапазоны пауз, мс: "min-max" или одно число
actionDelay=300-900
typingDelay=70-200
testDelay=2000-5000
# Постоянный профиль Chrome: cookies и пройденная капча сохраняются между запусками.
# Пусто = чистый профиль на каждый тест. Не использовать с threads>1 (Chrome блокирует профиль)
# Пример: userDataDir=build/chrome-profile (удалится при gradle clean) или ~/.ui-tests/chrome-profile
userDataDir=
# Секунд на ручное решение капчи в видимом локальном браузере (в headless/Selenoid не ждёт), 0 = сразу падать
captchaWait=120
